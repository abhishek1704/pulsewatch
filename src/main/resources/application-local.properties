
## Pulsewatch Application Properties
spring.application.name=pulsewatch
spring.datasource.url=jdbc:postgresql://localhost:5432/pulsewatch
spring.datasource.username=pulsewatch
spring.datasource.password=pulsewatch

## JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

## Kafka
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
pulsewatch.kafka.consumer.group-id=pulsewatch-monitoring
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=com.pulsewatch.telemetry.model
pulsewatch.kafka.telemetry-topic=api-telemetry

pulsewatch.kafka.ai-consumer.group-id=pulsewatch-ai
pulsewatch.kafka.anomaly-topic=api-anomalies

## Spring AI Configuration
#spring.ai.openai.api-key=${OPENAI_API_KEY}
#spring.ai.openai.chat.model=gpt-5-mini

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=gemma3:4b

## Pulsewatch Custom Configuration
pulsewatch.anomaly.errorRateThreshold=0.05
pulsewatch.anomaly.p95LatencyThresholdMs=2000
pulsewatch.anomaly.spikeMultiplier=2.0
pulsewatch.monitoring.window.minutes=15
pulsewatch.telemetry.endpoint.url=http://localhost:8080